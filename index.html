function timeAgo(iso){
  const diff = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(diff<1) return 'hozirgina';
  if(diff<60) return diff+' daqiqa oldin';
  const h=Math.floor(diff/60);
  if(h<24) return h+' soat oldin';

function sanitizeLogin(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,30); }

async function submitAuth(){
  const loginRaw = document.getElementById('a_login').value;
  const pass = document.getElementById('a_pass').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  const login = sanitizeLogin(loginRaw);
 
  if(authMode==='signup'){
    const name = document.getElementById('a_name').value.trim();
    if(!name || !login || pass.length<6){ errEl.textContent="Iltimos, barcha maydonlarni to'g'ri to'ldiring (parol kamida 6 belgi, login faqat harf/raqam)."; shakeCard(); return; }
    const {data, error} = await supabaseClient.auth.signUp({email: emailFor(login), password: pass});
    if(error){
      const msg = (error.message||'').toLowerCase();
      errEl.textContent = (msg.includes('already') || msg.includes('registered') || msg.includes('exists')) ? "Bu login band, boshqasini tanlang." : error.message;
      shakeCard(); return;
    }
    if(!data.session){ errEl.textContent = "Ro'yxatdan o'tish tugallanmadi. Administratorga murojaat qiling."; return; }
    session = data.session;
    const {error: insErr} = await supabaseClient.from('restaurants').insert({id: session.user.id, slug: login, name});
    if(insErr){ errEl.textContent = insErr.message; return; }
    await loadRestaurant();
    render();
  } else {
    if(!login || !pass){ errEl.textContent = "Login va parolni kiriting."; shakeCard(); return; }
    const {data, error} = await supabaseClient.auth.signInWithPassword({email: emailFor(login), password: pass});
    if(error){ errEl.textContent = "Login yoki parol noto'g'ri."; shakeCard(); return; }
    session = data.session;
    await loadRestaurant();
    render();
  }
}

/* ============================================================
   YANGI BUYURTMA OGOHLANTIRISHI — ovoz (takrorlanadi) + brauzer
   bildirishnomasi + miltillovchi sarlavha + katta banner.
   Admin ekranga tikilib o'tirmasa ham albatta payqaydi.
   ============================================================ */
const ORIGINAL_TITLE = document.title;
let alertActive = false;
let titleFlashTimer = null;
let repeatSoundTimer = null;
let alertPollTimer = null;
let lastSeenOrderTime = null;
let sharedAudioCtx = null;
 
// Ba'zi brauzerlar avval sahifada bosish bo'lmasa ovozni bloklaydi —
// birinchi bosishda ovoz ruxsatini oldindan tayyorlab qo'yamiz.
document.addEventListener('click', () => {
  if(!sharedAudioCtx){
    try{ sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(sharedAudioCtx && sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
}, {once:false});
 
function initOrderAlerts(){
  if(!restaurant || ordersChannel) return;
  lastSeenOrderTime = new Date().toISOString();
 
  ordersChannel = supabaseClient
    .channel('orders-alert-'+restaurant.id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'orders', filter:`restaurant_id=eq.${restaurant.id}`}, (payload) => {
      handleNewOrder(payload.new);
    })
    .subscribe();
 
  // Zaxira usul: agar "jonli" xabar biror sababga ko'ra kelmasa,
  // har 15 soniyada yangi buyurtma bor-yo'qligini o'zimiz tekshiramiz.
  clearInterval(alertPollTimer);
  alertPollTimer = setInterval(async () => {
    if(!restaurant) return;
    const {data} = await supabaseClient.from('orders').select('*').eq('restaurant_id', restaurant.id).gt('created_at', lastSeenOrderTime).order('created_at', {ascending:false});
    if(data && data.length){
      lastSeenOrderTime = data[0].created_at;
      handleNewOrder(data[0]);
    }
  }, 15000);
}
 
function handleNewOrder(order){
  startOrderAlert(order);
  hasNewOrderDot = true;
  const dot = document.getElementById('bellDot');
  if(dot) dot.classList.add('show');
  const bell = document.getElementById('bellBtn');
  if(bell){ bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring'); }
  if(currentTab==='orders') renderOrdersTab(order.id);
}
 
function startOrderAlert(order){
  alertActive = true;
  showAlertBanner(order);
  playAlertSound();
  showBrowserNotification(order);
 
  let count = 0;
  clearInterval(repeatSoundTimer);
  repeatSoundTimer = setInterval(() => {
    count++;
    if(!alertActive){ clearInterval(repeatSoundTimer); return; }
    playAlertSound();
  }, 4000);
 
  clearInterval(titleFlashTimer);
  let on = false;
  titleFlashTimer = setInterval(() => {
    document.title = on ? ORIGINAL_TITLE : '🔔 Yangi buyurtma!';
    on = !on;
  }, 1000);
}
function stopOrderAlert(){
  alertActive = false;
  clearInterval(repeatSoundTimer);
  clearInterval(titleFlashTimer);
  document.title = ORIGINAL_TITLE;
  hideAlertBanner();
}
function showAlertBanner(order){
  let banner = document.getElementById('orderAlertBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'orderAlertBanner';
    banner.className = 'order-alert-banner';
    document.body.appendChild(banner);
  }
  banner.innerHTML = `
    <div class="oab-inner">
      <span class="oab-icon">🔔</span>
      <div class="oab-text"><b>Yangi buyurtma!</b><br>№ ${order.code} · ${fmt(order.total)}</div>
      <button class="oab-btn" onclick="acknowledgeAlert()">Ko'rish</button>
    </div>`;
  requestAnimationFrame(() => banner.classList.add('show'));
}
function hideAlertBanner(){
  const banner = document.getElementById('orderAlertBanner');
  if(banner) banner.classList.remove('show');
}
function acknowledgeAlert(){
  stopOrderAlert();
  const ordersBtn = document.querySelector('.maintabs button[data-t="orders"]');
  if(ordersBtn) switchTab('orders', ordersBtn);
}
function playAlertSound(){
  try{
    if(!sharedAudioCtx){ sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    const ctx = sharedAudioCtx;
    if(ctx.state === 'suspended'){ ctx.resume(); }
    const beep = (freq, start, dur) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime+start+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.02);
    };
    beep(880, 0, 0.4); beep(1180, 0.18, 0.35);
  }catch(e){}
}

  if('Notification' in window && Notification.permission==='granted'){

async function setStatus(id, status, cancelReason){
  const update = {status};
  if(status==='bekor') update.cancel_reason = cancelReason || null;
  await supabaseClient.from('orders').update(update).eq('id', id);
  const local = orders.find(o => o.id === id);
  if(local){ local.status = status; if(status==='bekor') local.cancel_reason = cancelReason || null; }
  if(currentTab==='orders') renderOrdersTab(null, true);
  else if(currentTab==='courier') renderCourierTab();
}
 
/* ---------- WEEKLY CHART ---------- */
function renderWeeklyChart(){
  const dayNames = ['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];
  const days = [...Array(7)].map((_,i) => { const d = new Date(); d.setDate(d.getDate() - (6-i)); return d; });
  const dayData = days.map(d => {
    const key = d.toDateString();
    const dOrders = orders.filter(o => new Date(o.created_at).toDateString()===key && o.status!=='bekor');
    return {label: dayNames[d.getDay()], sum: dOrders.reduce((s,o)=>s+o.total,0), isToday: key===new Date().toDateString()};
  });
  const max = Math.max(...dayData.map(d=>d.sum), 1);
  return `<div class="chart-card">
    <div class="chart-head">Oxirgi 7 kunlik tushum</div>
    <div class="chart-bars">
      ${dayData.map((d,i) => `<div class="chart-col">
        <div class="chart-bar-wrap"><div class="chart-bar" data-today="${d.isToday?1:0}" style="height:${Math.max(4,(d.sum/max*100))}%; animation-delay:${i*0.05}s;"></div></div>
        <div class="chart-lbl">${d.label}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

      return `<div class="menu-item-row menu-item-edit">
        <div class="edit-grid">
          <div class="form-group"><label>Kategoriya</label><input id="e_cat_${m.id}" type="text" value="${(m.category||'').replace(/"/g,'&quot;')}"></div>
          <div class="form-group"><label>Nomi</label><input id="e_name_${m.id}" type="text" value="${(m.name||'').replace(/"/g,'&quot;')}"></div>
          <div class="form-group"><label>Tavsif</label><input id="e_desc_${m.id}" type="text" value="${(m.description||'').replace(/"/g,'&quot;')}"></div>
          <div class="form-group"><label>Narxi (so'm)</label><input id="e_price_${m.id}" type="number" value="${m.price}"></div>
        </div>
        <div class="edit-actions">
          <button class="primary-btn" onclick="saveMenuItem('${m.id}')">Saqlash</button>
          <button class="ghost-btn2" onclick="editingItemId=null;renderMenuTab()">Bekor qilish</button>
        </div>
      </div>`;
    }
    return `
    <div class="menu-item-row ${m.available===false?'unavailable':''}">
      <div class="mi-photo" onclick="triggerImageEdit('${m.id}')" title="Rasmni almashtirish">${m.image?`<img src="${m.image}">`:'📷'}</div>
      <div style="flex:1;min-width:0;"><div class="mi-name">${m.name}</div><div class="mi-cat">${m.category}</div></div>
      <div class="mi-price grad-text">${fmt(m.price)}</div>
      <button class="mi-avail ${m.available===false?'off':'on'}" onclick="toggleAvailable('${m.id}', ${m.available!==false})">${m.available===false?'⛔ Tugagan':'✅ Mavjud'}</button>
      <button class="mi-edit" onclick="editingItemId='${m.id}';renderMenuTab()">✏️</button>
      <button class="mi-del" onclick="deleteMenuItem('${m.id}')">O'chirish</button>
    </div>`;
  }).join('');
}
 
async function saveMenuItem(id){
  const category = document.getElementById(`e_cat_${id}`).value.trim();
  const name = document.getElementById(`e_name_${id}`).value.trim();
  const description = document.getElementById(`e_desc_${id}`).value.trim();
  const price = Number(document.getElementById(`e_price_${id}`).value);
  if(!category || !name || !price){ alert("Iltimos, kategoriya, nom va narxni to'ldiring."); return; }
  await supabaseClient.from('menu_items').update({category, name, description, price}).eq('id', id);
  const local = menuItems.find(m => m.id === id);
  if(local){ Object.assign(local, {category, name, description, price}); }
  editingItemId = null;
  renderMenuTab(true);
}
 
async function addMenuItem(){
  const category = document.getElementById('m_cat').value.trim();
  const name = document.getElementById('m_name').value.trim();
  const description = document.getElementById('m_desc').value.trim();
  const price = Number(document.getElementById('m_price').value);
  const fileInput = document.getElementById('m_image');
  const file = fileInput && fileInput.files[0];
  if(!category || !name || !price){ alert("Iltimos, kategoriya, nom va narxni to'ldiring."); return; }
 
  const btn = document.querySelector('.menu-add .primary-btn');
  if(btn){ btn.disabled = true; btn.textContent = "Qo'shilmoqda..."; }
 
  let image = null;
  if(file){ image = await uploadMenuImage(file); }
 
  const {data} = await supabaseClient.from('menu_items').insert({restaurant_id: restaurant.id, category, name, description, price, image, available:true}).select().single();
  if(data) menuItems.push(data);
  renderMenuTab(true);
}
 
async function uploadMenuImage(file){
  try{
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path = `${restaurant.id}/${Date.now()}-${safeName}`;
    const {error: upErr} = await supabaseClient.storage.from('menu-images').upload(path, file);
    if(upErr){ alert("Rasm yuklashda xatolik: "+upErr.message+"\n\nEslatma: Supabase'da 'menu-images' nomli ochiq (public) Storage bucket yaratilganiga ishonch hosil qiling."); return null; }
    const {data:pub} = supabaseClient.storage.from('menu-images').getPublicUrl(path);
    return pub.publicUrl;
  }catch(e){
    alert("Rasm yuklashda xatolik yuz berdi.");
    return null;
  }
}
function triggerImageEdit(id){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if(!file) return;
    const image = await uploadMenuImage(file);
    if(!image) return;
    await supabaseClient.from('menu_items').update({image}).eq('id', id);
    const local = menuItems.find(m => m.id === id);
    if(local) local.image = image;
    renderMenuTab(true);
  };
  input.click();
}
async function toggleAvailable(id, current){
  await supabaseClient.from('menu_items').update({available: !current}).eq('id', id);
  const local = menuItems.find(m => m.id === id);
  if(local) local.available = !current;
  renderMenuTab(true);
}
async function deleteMenuItem(id){
  await supabaseClient.from('menu_items').delete().eq('id', id);
  menuItems = menuItems.filter(m => m.id !== id);
  renderMenuTab(true);
}
 
boot();
</script>
</body>
</html>
